<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pantryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#pantryGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Chef Hat & Pot Emblem -->
  <g filter="url(#shadow)" transform="translate(96, 80)">
    <!-- Chef Hat Base -->
    <path d="M 50 170 C 20 140, 20 80, 70 60 C 90 20, 160 10, 190 50 C 230 20, 290 50, 280 110 C 310 130, 310 180, 270 200 L 50 200 Z" fill="#ffffff" />
    <!-- Hat band -->
    <rect x="45" y="195" width="230" height="30" rx="8" fill="#e2e8f0" />
    <line x1="60" y1="210" x2="260" y2="210" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Organic Sprout / Zero Waste Leaf on top -->
    <path d="M 160 50 C 140 10, 180 -15, 210 -5 C 220 20, 190 40, 160 50 Z" fill="url(#leafGrad)" />
    <path d="M 160 50 C 175 25, 200 15, 205 0" stroke="#047857" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cooking Skillet / Pan with Sparkle -->
    <rect x="20" y="245" width="280" height="40" rx="20" fill="#ffffff" />
    <path d="M 40 280 L 70 340 C 85 365, 235 365, 250 340 L 280 280 Z" fill="#f8fafc" />
    <!-- Sparkle Stars -->
    <circle cx="270" cy="80" r="14" fill="#fbbf24" />
    <circle cx="50" cy="90" r="10" fill="#34d399" />
  </g>
</svg>
